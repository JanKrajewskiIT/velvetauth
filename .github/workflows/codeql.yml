name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analysis:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/codeql-analysis.yml@0d574e1e43ae072a9ec54852490f1b5eb5dc9c8a # v3.19.0 tooling fix
    permissions:
      actions: read
      contents: read
      security-events: write
