name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analysis:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/codeql-analysis.yml@b3237eb74b340e5d039a3383361d683d04629028 # v3.7.10
    permissions:
      actions: read
      contents: read
      security-events: write
