name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analysis:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/codeql-analysis.yml@4fd5cec48d9007aee67644ce29fdedef392f1dea # v3.20.0
    permissions:
      actions: read
      contents: read
      security-events: write
