name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analysis:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/codeql-analysis.yml@63c6a5b52de7049094e47aa6488e3cebcbd29f05 # v3.7.13
    permissions:
      actions: read
      contents: read
      security-events: write
