name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analysis:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/codeql-analysis.yml@e9100fa7ea7797669afeb410b644cd46ff9c8064 # v3.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
