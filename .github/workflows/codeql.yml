name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analysis:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/codeql-analysis.yml@9e94e67bb18819c561c78eb286a2a68e689200b1 # v3.16.0 tooling fix
    permissions:
      actions: read
      contents: read
      security-events: write
