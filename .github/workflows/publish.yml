name: Publish
on:
  push:
    tags:
      - v*
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/build-package.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    with:
      package-artifact: velvet-package
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  publish:
    needs: build
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/publish-package.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
permissions:
  contents: read
