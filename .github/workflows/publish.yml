name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      packages: read
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  publish:
    needs: verify
    uses: jankrajewskiit/velvetconfigs/.github/workflows/publish-package.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
