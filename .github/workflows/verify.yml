name: Verify

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm audit --audit-level=high

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify
