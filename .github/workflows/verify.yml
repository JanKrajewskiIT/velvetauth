name: Verify
on:
  workflow_call:
    secrets:
      GHCR_TOKEN:
        required: false
      NPM_READ_TOKEN:
        required: false
      CONFIGS_READ_TOKEN:
        required: false
jobs:
  verify:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/verify-package.yml@9e94e67bb18819c561c78eb286a2a68e689200b1 # v3.16.0 tooling fix
    with:
      package-artifact: velvet-package
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
permissions:
  contents: read
