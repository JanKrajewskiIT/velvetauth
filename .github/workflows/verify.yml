name: Verify
on:
  workflow_call:
    secrets:
      GHCR_TOKEN:
        required: false
      NPM_READ_TOKEN:
        required: false
      CONFIGS_READ_TOKEN:
        required: false
jobs:
  verify:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/verify-package.yml@e9100fa7ea7797669afeb410b644cd46ff9c8064 # v3.7.0
    with:
      package-artifact: velvet-package
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
permissions:
  contents: read
