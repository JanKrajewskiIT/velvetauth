name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
permissions:
  contents: read
